[project]
name = "naut-trader"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "nautilus_trader>=2.0.0rc1,<3",
]

[tool.uv]
prerelease = "allow"

[project.scripts]
naut-trader = "naut_trader.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
