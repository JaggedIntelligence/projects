[package]
name = "tauri-native"
version = "0.1.0"
description = "SpeedBox — network diagnostic suite"
authors = ["agmmnn"]
edition = "2021"

[lib]
name = "tauri_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri-plugin-log = "2"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Speed test
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["full"] }

# DNS test
hickory-resolver = { version = "0.24", features = ["system-config"] }
netdev = "0.35"

# History
rusqlite = { version = "0.31", features = ["bundled"] }


[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
